name: CI

# Lint, test and build on every push and pull request. On main, the tested images are
# published to GitHub Container Registry so a future AWS or Render deploy only pulls them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "ruff>=0.11"
      - run: ruff check .
      - run: ruff format --check .

  backend-tests:
    name: Backend tests (FastAPI + Celery + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: backend } }
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install CPU PyTorch and the backend
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1" "torchvision==0.29.2"
          pip install -e ".[ml,dev]"
      - name: Tests
        run: python -m pytest -rs
      - name: Celery integration test actually ran
        run: python -m pytest tests/test_jobs.py -k celery -rs | tee celery.txt && ! grep -q SKIPPED celery.txt

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: "1" }

  docker:
    name: Docker images and stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [backend-lint, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: api
          load: true
          tags: lumber-spine-ai/api:local
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: worker
          load: true
          tags: lumber-spine-ai/worker:local
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: lumber-spine-ai/web:local
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Start the stack without rebuilding
        run: |
          mkdir -p backend/model
          docker compose up -d --no-build
      - name: Smoke test (health, readiness with a live Celery worker, web)
        run: |
          for i in $(seq 1 60); do curl -fs http://localhost:8000/health && break; sleep 2; done
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8000/ready | tee ready.json | grep -q '"ready":true'; then break; fi
            sleep 3
          done
          cat ready.json; grep -q '"backend":"celery"' ready.json
          curl -fs http://localhost:3000/ > /dev/null
          curl -fs -X POST http://localhost:8000/api/chat/threads -H 'Content-Type: application/json' -d '{}'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - run: docker compose down -v
        if: always()

  publish:
    name: Publish images to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-tests, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: api, context: backend, target: api }
          - { name: worker, context: backend, target: worker }
          - { name: web, context: frontend, target: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR needs lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
