[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lumber-spine-ai-backend"
version = "3.0.0"
description = "FastAPI + Celery backend for lumbar spine MRI degenerative classification"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Abdullah Khalid" }]
license = { text = "Proprietary" }
# API process: no torch. Install the `ml` extra wherever inference runs (worker / local mode).
dependencies = [
  "fastapi>=0.135,<1",
  "starlette>=1.3.1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20",
  "python-dotenv>=1.1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "celery[redis]>=5.4,<6",
  "redis>=5.2",
  "google-genai>=1.20",
  "reportlab>=4.4",
  "pydicom>=3.0.1",
  "pillow>=11.2",
  "numpy>=2.2,<3",
]

[project.optional-dependencies]
ml = [
  "torch>=2.14,<2.16",
  "torchvision>=0.29,<0.31",
  "timm>=1.0.15,<2",
  "ultralytics>=8.3.130,<9",
  "opencv-python-headless>=4.11",
  "monai>=1.6.1,<1.7",
]
dev = [
  "ruff>=0.11",
  "pytest>=8.3",
  "bandit[toml]>=1.8",
  "pip-audit>=2.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tools/validate_saliency.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = [
  "S101",  # asserts are fine in tests
  "B008",  # FastAPI Depends()/File() defaults
  "S311",  # non-crypto random is not used for security
  "B905",  # zip() strictness is not needed for these fixed-length pairs
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"tools/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["models: needs real checkpoints in MODEL_DIR (skipped when absent)"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
