# Lumber Spine AI - full stack with Docker Compose
#
#   Windows: double-click docker-start.bat     (stop: docker-stop.bat)
#   Any OS:  docker compose pull               download the images CI built (fastest)
#            docker compose up -d              start; builds locally only what is missing
#            docker compose up -d --build      rebuild after changing code locally
#   Then open http://localhost:3000.
#
# Before the first start:
#   1. Put the model checkpoints in backend/model   (see backend/model/README.md)
#   2. Copy backend/.env.example to backend/.env and add your API keys
#
# Services
#   redis   job broker and result store
#   api     FastAPI on http://localhost:8000 (no PyTorch; only queues work)
#   worker  Celery worker with PyTorch; loads the models once and runs every analysis
#   web     Next.js on http://localhost:3000
#
# Useful commands
#   docker compose ps                      status and health
#   docker compose logs -f worker          follow analysis logs
#   docker compose up -d --scale worker=2  more analysis capacity (needs more RAM)
#   docker compose down                    stop (saved cases and chats are kept)
#   docker compose down -v                 stop and delete saved cases and chats

name: lumber-spine-ai

x-backend-env: &backend-env
  REDIS_URL: redis://redis:6379/0
  DATA_DIR: /app/data
  MODEL_DIR: /app/model
  RUNNING_IN_DOCKER: "1" # localhost in OLLAMA_BASE_URL then means this computer

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: { context: ./backend, target: api }
    image: ghcr.io/abduiiahkhaiid/lumber-spine-ai-api:latest
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      <<: *backend-env
      JOB_BACKEND: celery
      FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports: ["8000:8000"]
    volumes:
      - app-data:/app/data
      - ./backend/model:/app/model:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: { context: ./backend, target: worker }
    image: ghcr.io/abduiiahkhaiid/lumber-spine-ai-worker:latest
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      <<: *backend-env
      WORKER_PRELOAD_MODELS: "1"
    volumes:
      - app-data:/app/data # shared with the API: uploads are handed over here
      - ./backend/model:/app/model:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # The browser calls the API directly, so this is the address as seen from your browser.
        NEXT_PUBLIC_API_ORIGIN: http://localhost:8000
    image: ghcr.io/abduiiahkhaiid/lumber-spine-ai-web:latest
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  app-data: # saved cases, conversations and in-flight uploads
